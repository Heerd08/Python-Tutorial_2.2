<!DOCTYPE html>
<html>
<head>
  <title>Fahrenheit to Celsius</title>
</head>
<body>

  <h3>Fahrenheit to Celsius Converter</h3>

  <input type="text" id="fahrenheit" placeholder="Enter Fahrenheit">
  <button onclick="convert()">Convert</button>

  <p id="result"></p>

  <script>
    function convert() {
      var f = document.getElementById("fahrenheit").value;
      var c = (f - 32) * 5 / 9;
      document.write(c+"c")

  </script>

</body>
</html>
